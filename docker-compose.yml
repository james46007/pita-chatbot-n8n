services:
  n8n-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pita_n8n_chatbot
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Lima}
      - TZ=${TZ:-America/Lima}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Base de Datos (PostgreSQL o SQLite por defecto)
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-}
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST:-}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT:-}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-}
      - DB_POSTGRESDB_SCHEMA=${DB_POSTGRESDB_SCHEMA:-public}
      - DB_POSTGRESDB_SSL_ENABLED=${DB_POSTGRESDB_SSL_ENABLED:-}
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=${DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED:-false}
      # Variables del Sistema Pita
      - PITA_API_BASE_URL=${PITA_API_BASE_URL}
      - PITA_BOT_SECRET_KEY=${PITA_BOT_SECRET_KEY}
      # Variables de Evolution API
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_GLOBAL_KEY=${EVOLUTION_GLOBAL_KEY}
      # Configuración de Anti-baneo
      - ANTIBAN_MIN_READ_DELAY_MS=${ANTIBAN_MIN_READ_DELAY_MS:-1500}
      - ANTIBAN_MAX_READ_DELAY_MS=${ANTIBAN_MAX_READ_DELAY_MS:-3500}
      - ANTIBAN_MS_PER_CHAR=${ANTIBAN_MS_PER_CHAR:-35}
      - ANTIBAN_MIN_TYPING_MS=${ANTIBAN_MIN_TYPING_MS:-2000}
      - ANTIBAN_MAX_TYPING_MS=${ANTIBAN_MAX_TYPING_MS:-7000}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/initial-workflows:ro

volumes:
  n8n_data:
    name: pita_n8n_data
